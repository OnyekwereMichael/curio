<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#12062a">
<title>Fact or Fiction</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=VT323&display=swap" rel="stylesheet">
<style>
/* ───────────── Theme ───────────── */
:root{
  --bg:#12062a; --panel:#241046; --panel2:#33165f; --ink:#fff; --muted:#b9a6e6;
  --green:#22c55e; --red:#ef4444; --yellow:#facc15; --purple:#8b5cf6; --pink:#ec4899; --cyan:#22d3ee;
  --px:'Press Start 2P',ui-monospace,monospace; --body:'VT323',ui-monospace,monospace;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;min-height:100%}
body{
  min-height:100dvh;background:
    radial-gradient(circle at 15% 8%,rgba(139,92,246,.55),transparent 42%),
    radial-gradient(circle at 90% 92%,rgba(236,72,153,.35),transparent 45%),
    radial-gradient(circle at 50% 50%,#1d0a3d,var(--bg) 70%);
  background-attachment:fixed;color:var(--ink);font-family:var(--body);font-size:22px;line-height:1.15;
  overflow-x:hidden;-webkit-text-size-adjust:100%;
}
/* CRT scanlines + vignette */
body::after{content:"";position:fixed;inset:0;pointer-events:none;z-index:9999;
  background:repeating-linear-gradient(0deg,rgba(0,0,0,.2) 0 1px,transparent 1px 3px),
             radial-gradient(ellipse at center,transparent 60%,rgba(0,0,0,.45));}
#app{max-width:520px;margin:0 auto;padding:18px 16px calc(28px + env(safe-area-inset-bottom));min-height:100dvh}
.screen{display:flex;flex-direction:column;gap:16px;animation:fadein .25s ease-out}
@keyframes fadein{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.shake{animation:shake .5s cubic-bezier(.36,.07,.19,.97)}
@keyframes shake{10%,90%{transform:translateX(-3px)}20%,80%{transform:translateX(6px)}30%,50%,70%{transform:translateX(-10px)}40%,60%{transform:translateX(10px)}}

/* ───────────── Type ───────────── */
h1,h2,h3,.px{font-family:var(--px);font-weight:400;margin:0;letter-spacing:.5px}
.logo{font-family:var(--px);text-align:center;font-size:30px;line-height:1.35;text-shadow:3px 3px 0 #000,0 0 18px rgba(139,92,246,.9);
  animation:bounce 1.4s ease-in-out infinite;margin:10px 0 0}
.logo .f{color:var(--green)} .logo .x{color:var(--red)} .logo small{display:block;font-size:14px;color:var(--yellow);margin:6px 0}
@keyframes bounce{0%,100%{transform:translateY(0) rotate(-1deg)}50%{transform:translateY(-10px) rotate(1deg)}}
.tag{font-family:var(--px);font-size:10px;padding:6px 8px;border:3px solid #000;border-radius:8px;background:var(--yellow);color:#000;display:inline-block}
.muted{color:var(--muted)}
.center{text-align:center}

/* ───────────── Cards / inputs ───────────── */
.card{background:linear-gradient(180deg,var(--panel2),var(--panel));border:4px solid #000;border-radius:16px;padding:16px;
  box-shadow:0 6px 0 #000,0 0 22px rgba(139,92,246,.35)}
.card.pad{padding:20px}
label.px{font-size:11px;color:var(--cyan);display:block;margin-bottom:8px}
input[type=text]{width:100%;font-family:var(--px);font-size:16px;padding:16px 14px;border:4px solid #000;border-radius:12px;
  background:#0d0420;color:#fff;outline:none;box-shadow:inset 0 4px 0 rgba(0,0,0,.5)}
input[type=text]:focus{border-color:var(--cyan);box-shadow:0 0 0 3px rgba(34,211,238,.35),inset 0 4px 0 rgba(0,0,0,.5)}
input.code{text-align:center;text-transform:uppercase;letter-spacing:10px;font-size:24px}
.or{font-family:var(--px);font-size:10px;color:var(--muted);text-align:center;margin:6px 0}

/* ───────────── Chunky 3D buttons ───────────── */
.btn{font-family:var(--px);font-size:14px;line-height:1.3;color:#fff;text-shadow:2px 2px 0 #000;width:100%;min-height:62px;
  padding:16px 14px;border:4px solid #000;border-radius:14px;cursor:pointer;background:var(--purple);touch-action:manipulation;
  box-shadow:0 7px 0 #000,inset 0 -6px 0 rgba(0,0,0,.25),inset 0 4px 0 rgba(255,255,255,.3);
  transition:transform .05s,box-shadow .05s,filter .15s;user-select:none}
.btn:active,.btn.pressed{transform:translateY(7px);box-shadow:0 0 0 #000,inset 0 -3px 0 rgba(0,0,0,.25),inset 0 3px 0 rgba(255,255,255,.2)}
.btn:disabled{filter:grayscale(.85) brightness(.7);cursor:not-allowed;transform:translateY(4px);box-shadow:0 3px 0 #000}
.btn.green{background:var(--green)} .btn.red{background:var(--red)}
.btn.yellow{background:var(--yellow);color:#000;text-shadow:none} .btn.pink{background:var(--pink)}
.btn.ghost{background:#3b2a66;font-size:11px;min-height:50px}
.btn.big{min-height:104px;font-size:20px;border-radius:18px}
.btn.chosen{outline:5px solid #fff;outline-offset:3px;animation:pulse .8s infinite alternate}
.btn.dim{filter:grayscale(.7) brightness(.6)}
@keyframes pulse{to{outline-color:var(--yellow)}}
.row{display:flex;gap:12px}.row>*{flex:1}

/* ───────────── Lobby ───────────── */
.roomcode{display:flex;gap:8px;justify-content:center;margin:8px 0}
.roomcode b{font-family:var(--px);font-size:30px;width:56px;height:70px;display:grid;place-items:center;background:#0d0420;
  border:4px solid #000;border-radius:12px;color:var(--yellow);text-shadow:0 0 12px var(--yellow);box-shadow:0 5px 0 #000}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.pl{position:relative;display:flex;align-items:center;gap:10px;background:#0d0420;border:4px solid #000;border-radius:14px;padding:10px;min-height:68px;box-shadow:0 4px 0 #000}
.pl.me{border-color:var(--cyan)} .pl.away{opacity:.45}
.pl.pop{animation:pop .45s cubic-bezier(.2,1.8,.4,1) both}
@keyframes pop{from{transform:scale(0) rotate(-20deg)}to{transform:scale(1)}}
.av{font-size:34px;line-height:1;filter:drop-shadow(2px 2px 0 #000)}
.pl .nm{flex:1;min-width:0;overflow-wrap:anywhere;font-size:22px}
.pl .crown{position:absolute;top:-16px;left:6px;font-size:24px;transform:rotate(-14deg)}
.kick{width:34px;height:34px;border:3px solid #000;border-radius:8px;background:var(--red);color:#fff;font-family:var(--px);font-size:12px;cursor:pointer;box-shadow:0 3px 0 #000}
.kick:active{transform:translateY(3px);box-shadow:none}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{font-family:var(--px);font-size:10px;padding:12px 10px;min-height:44px;border:3px solid #000;border-radius:10px;background:#3b2a66;color:#fff;cursor:pointer;box-shadow:0 4px 0 #000;touch-action:manipulation}
.chip.on{background:var(--cyan);color:#000}
.chip:active{transform:translateY(4px);box-shadow:none}
.chip[disabled]{cursor:default}
.set-title{font-family:var(--px);font-size:10px;color:var(--cyan);margin:12px 0 8px}.set-title:first-child{margin-top:0}

/* ───────────── Game HUD / health bar ───────────── */
.hud{display:flex;justify-content:space-between;align-items:center;gap:8px;font-family:var(--px);font-size:11px}
.bar{display:flex;gap:3px;padding:5px;background:#000;border:4px solid #000;border-radius:10px;box-shadow:0 0 0 3px #4c2a8c}
.bar i{flex:1;height:24px;background:linear-gradient(#bbf7d0,var(--green) 60%,#15803d);border-radius:2px;transition:background .2s}
.bar i.off{background:#2a2140}
.bar.danger{animation:flash .5s infinite alternate}
.bar.danger i:not(.off){background:linear-gradient(#fecaca,var(--red) 60%,#991b1b)}
@keyframes flash{to{box-shadow:0 0 0 3px var(--red),0 0 18px var(--red)}}
.secs{font-family:var(--px);font-size:28px;text-align:center;text-shadow:3px 3px 0 #000}
.secs.danger{color:var(--red)}
.stmt{font-size:30px;line-height:1.1;text-align:center;min-height:150px;display:grid;place-items:center}
.vstat{font-family:var(--px);font-size:10px;text-align:center;color:var(--muted)}

/* ───────────── Reveal ───────────── */
.verdict{font-family:var(--px);font-size:32px;text-align:center;padding:18px 10px;border:5px solid #000;border-radius:14px;
  text-shadow:3px 3px 0 #000;animation:slam .55s cubic-bezier(.2,1.5,.4,1) both;box-shadow:0 7px 0 #000}
.verdict.fact{background:var(--green)} .verdict.fiction{background:var(--red)}
@keyframes slam{0%{transform:scale(4) rotate(-14deg);opacity:0}60%{transform:scale(.92) rotate(-2deg);opacity:1}100%{transform:scale(1) rotate(-2deg)}}
.why{border-left:6px solid var(--yellow);padding:6px 12px;font-size:24px}
.result{font-family:var(--px);font-size:13px;text-align:center;line-height:1.6}
.result.good{color:var(--green)} .result.bad{color:var(--red)} .result small{display:block;color:var(--muted);font-size:10px;margin-top:4px}
.picks{display:flex;flex-direction:column;gap:8px}
.pick{display:flex;align-items:center;gap:10px;background:#0d0420;border:3px solid #000;border-radius:12px;padding:8px 10px;animation:fadein .3s both}
.pick .nm{flex:1;min-width:0;overflow-wrap:anywhere}
.pick .ch{font-family:var(--px);font-size:9px;padding:5px 6px;border:2px solid #000;border-radius:6px;color:#000}
.ch.f{background:var(--green)} .ch.x{background:var(--red)} .ch.n{background:#6b5a99;color:#fff}
.pick .pts{font-family:var(--px);font-size:10px;min-width:62px;text-align:right}
.pick .pts.z{color:var(--muted)} .pick .pts.p{color:var(--yellow)}

/* ───────────── Podium / leaderboard ───────────── */
.podium{display:flex;align-items:flex-end;justify-content:center;gap:8px;min-height:250px;padding-top:34px}
.pod{flex:1;max-width:150px;text-align:center;display:flex;flex-direction:column;align-items:center;justify-content:flex-end}
.pod .who{margin-bottom:6px;overflow-wrap:anywhere;font-size:20px}
.pod .who .av{display:block;font-size:40px}
.pod .crown{font-size:34px;animation:drop .7s 1.7s cubic-bezier(.2,1.6,.4,1) both;display:block}
@keyframes drop{from{transform:translateY(-80px) rotate(-30deg);opacity:0}to{transform:rotate(-12deg);opacity:1}}
.block{width:100%;border:4px solid #000;border-radius:10px 10px 0 0;display:flex;flex-direction:column;align-items:center;justify-content:flex-start;padding-top:8px;gap:6px;
  font-family:var(--px);font-size:16px;text-shadow:2px 2px 0 #000;transform-origin:bottom;animation:rise .8s cubic-bezier(.2,1.2,.4,1) both;box-shadow:inset 0 5px 0 rgba(255,255,255,.3)}
.block small{font-size:9px}
.p1 .block{height:140px;background:#fbbf24;animation-delay:1s} .p2 .block{height:100px;background:#94a3b8;animation-delay:.5s} .p3 .block{height:70px;background:#c2762f;animation-delay:.1s}
@keyframes rise{from{transform:scaleY(0)}to{transform:scaleY(1)}}
.lb{display:flex;flex-direction:column;gap:8px}
.lbrow{display:flex;align-items:center;gap:10px;background:#0d0420;border:3px solid #000;border-radius:12px;padding:8px 10px}
.lbrow.me{border-color:var(--cyan)} .lbrow .rk{font-family:var(--px);font-size:11px;width:30px;color:var(--yellow)}
.lbrow .nm{flex:1;min-width:0;overflow-wrap:anywhere} .lbrow .sc{font-family:var(--px);font-size:11px}

/* ───────────── Misc ───────────── */
#fx{position:fixed;inset:0;pointer-events:none;overflow:hidden;z-index:9000}
#fx span{position:absolute;top:-40px;font-size:28px;animation:fall linear forwards}
@keyframes fall{to{transform:translate(var(--dx),110vh) rotate(var(--rot))}}
#toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom));transform:translate(-50%,40px);opacity:0;z-index:9500;max-width:90vw;
  font-family:var(--px);font-size:11px;line-height:1.5;text-align:center;background:#000;color:#fff;border:3px solid var(--yellow);border-radius:10px;padding:12px 14px;transition:.25s;pointer-events:none}
#toast.show{transform:translate(-50%,0);opacity:1}
#mute{position:fixed;top:10px;right:10px;z-index:9500;width:44px;height:44px;border:3px solid #000;border-radius:10px;background:#3b2a66;font-size:20px;cursor:pointer;box-shadow:0 4px 0 #000}
#mute:active{transform:translateY(4px);box-shadow:none}
.dots::after{content:"";animation:dots 1.2s steps(4) infinite}
@keyframes dots{0%{content:""}25%{content:"."}50%{content:".."}75%{content:"..."}}
@media (max-width:380px){.logo{font-size:24px}.btn.big{font-size:17px}.stmt{font-size:26px}.roomcode b{width:46px;height:60px;font-size:24px}}
@media (prefers-reduced-motion:reduce){*{animation-duration:.01ms!important;animation-iteration-count:1!important}}
</style>
</head>
<body>
<button id="mute" aria-label="Toggle sound">🔊</button>
<div id="app"></div>
<div id="fx"></div>
<div id="toast" role="status" aria-live="polite"></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script>
'use strict';
/* =====================================================================================
   FACT OR FICTION — real-time multiplayer party game (2–8 players)

   HOW IT WORKS
   • Backend: Supabase (Postgres + Realtime). Three tables: fof_rooms, fof_players, fof_votes.
     Schema + rules live in supabase/optional/fact_or_fiction.sql — run it once.
   • Every client simply re-reads the room/players/votes whenever something changes (refresh()).
     The UI is a pure function of that state, so refreshes and reconnects "just work".
   • Scores are NOT stored: they are derived from the votes (computeAll) by every client,
     so they can never disagree between devices.
   • The host's device ends a round (everyone voted, or its own local timer + grace) and advances rounds.
     If the host disappears, the longest-present player is promoted automatically.
   • Fairness: each player's response time is measured on their OWN device from the moment the
     question appears for them. No synced clocks are used anywhere.

   EXTENDING
   • Add statements:   append to BANK below with S('cat', true|false, 'statement', 'why').
   • Add a category:   add an entry to CATS, then use its key in S(...).
   • Tweak scoring:    see scoreRound(). Tweak options:  ROUND_OPTIONS / TIMER_OPTIONS.
   ===================================================================================== */

/* ─── Config ─────────────────────────────────────────────────────────────── */
const SUPABASE_URL = 'https://yetfoyuysgqksjwrelow.supabase.co';
const SUPABASE_KEY = 'sb_publishable_XqUVZNBSYWssvQGLk3WYXA_jwXqbqpg'; // publishable (anon) key — safe to ship in the browser
const MAX_PLAYERS = 8, MIN_PLAYERS = 2, NAME_MAX = 14;
const ROUND_OPTIONS = [5, 10, 15, 20], TIMER_OPTIONS = [10, 15, 20, 30];
const AWAY_AFTER_MS = 20000;      // no heartbeat for this long = player is considered gone (never blocks a round)
const HOST_GRACE_MS = 2500;       // host waits this long past the timer so slow devices' votes still arrive
const AVATARS = ['🦊','🐼','🐸','🦁','🐙','🦄','🐵','🐧','🦖','🐯','🐰','🐨','🦉','🐲','👾','🤖'];

/* ─── Categories & statement bank ────────────────────────────────────────── */
const CATS = {
  sci: { label: 'Science',        icon: '🔬' },
  his: { label: 'History',        icon: '🏛️' },
  ani: { label: 'Animals',        icon: '🐾' },
  geo: { label: 'Geography',      icon: '🗺️' },
  pop: { label: 'Pop Culture',    icon: '🎬' },
  afr: { label: 'Naija & Africa', icon: '🌍' },
};
const BANK = [];
// S(category, isFact, statement, why). IDs follow insertion order — APPEND new statements at the end.
function S(cat, a, q, why) { BANK.push({ id: BANK.length, cat, a, q, why }); }

// Science
S('sci', true,  'Honey never spoils. Edible honey has been found in ancient Egyptian tombs.', 'Its low moisture and high acidity make it nearly impossible for microbes to survive.');
S('sci', false, 'Lightning never strikes the same place twice.', 'The Empire State Building gets hit around 20–25 times every year.');
S('sci', true,  'A day on Venus is longer than a year on Venus.', 'Venus spins once every ~243 Earth days but circles the Sun in only ~225.');
S('sci', false, 'Sound travels faster in space than it does in air.', 'Sound needs something to travel through, and space is almost a vacuum, so it barely travels at all.');
S('sci', true,  'Bananas are slightly radioactive.', 'They contain potassium-40, a natural radioactive isotope. It is completely harmless.');
S('sci', false, 'Old church windows are thicker at the bottom because glass slowly flows downward.', 'Glass is an amorphous solid. Old panes were simply made unevenly and installed with the heavy edge down.');
S('sci', true,  'An adult human body has 206 bones.', 'Babies are born with far more (around 270+), and many fuse together as we grow.');
S('sci', false, 'Humans only use 10% of their brains.', 'Brain scans show we use virtually all of our brain over the course of a day.');
S('sci', true,  'Water can boil and freeze at the same time.', 'At the "triple point" (0.01°C and very low pressure), ice, liquid water and vapour coexist.');
// History
S('his', false, 'The Great Wall of China is visible from space with the naked eye.', 'It is very long but extremely narrow. Astronauts say it cannot be picked out unaided.');
S('his', true,  'Cleopatra lived closer in time to the Moon landing than to the building of the Great Pyramid.', 'The Great Pyramid dates to about 2560 BC, Cleopatra died in 30 BC, and the Moon landing was in 1969.');
S('his', false, 'Napoleon Bonaparte was unusually short.', 'He was about 5\'6"–5\'7", average or taller for his time. Mixed-up French and English inches started the myth.');
S('his', false, 'Vikings wore horned helmets into battle.', 'There is no evidence of it. The image comes from 19th-century opera costumes.');
S('his', true,  'The Hundred Years\' War lasted 116 years.', 'It ran from 1337 to 1453.');
S('his', true,  'The Titanic sank on its very first voyage.', 'It left Southampton in April 1912 and hit an iceberg a few days into its maiden crossing.');
S('his', false, 'Albert Einstein failed maths at school.', 'He excelled at maths and had mastered calculus by about age 15.');
// Animals
S('ani', true,  'Octopuses have three hearts.', 'Two pump blood through the gills and one pumps it to the rest of the body.');
S('ani', false, 'Goldfish have a three-second memory.', 'Studies show they can remember things for months.');
S('ani', false, 'Bats are blind.', 'All bats can see, and many also use echolocation to hunt in the dark.');
S('ani', true,  'Wombats produce cube-shaped poop.', 'Their intestines shape it into cubes, which helps it stay put and mark territory.');
S('ani', true,  'A group of flamingos is called a "flamboyance".', 'It really is, and it fits perfectly.');
S('ani', false, 'Camels store water in their humps.', 'The humps store fat. Camels survive without water thanks to other adaptations.');
S('ani', true,  'Sharks are older than trees.', 'Sharks have been around for roughly 450 million years. The first trees appeared about 385 million years ago.');
S('ani', true,  'Giraffes have the same number of neck bones as humans: seven.', 'Giraffe neck bones are just enormously long.');
S('ani', false, 'Ostriches bury their heads in the sand when scared.', 'That is a myth. They lie low with their necks flat along the ground to hide.');
// Geography
S('geo', true,  'Africa has more countries than any other continent.', 'Africa has 54 recognised countries.');
S('geo', false, 'The Sahara is the largest desert in the world.', 'Antarctica is bigger. A desert is defined by low rainfall, not heat.');
S('geo', false, 'Sydney is the capital of Australia.', 'The capital is Canberra, chosen as a compromise between Sydney and Melbourne.');
S('geo', true,  'Vatican City is the smallest country in the world.', 'It covers only about 0.44 square kilometres.');
S('geo', true,  'Russia spans 11 time zones.', 'It is so wide that the sun rises in the east while it is still the previous day in the west.');
S('geo', false, 'Istanbul is the capital of Turkey.', 'The capital is Ankara, even though Istanbul is the largest city.');
S('geo', true,  'Greenland is the largest island in the world.', 'At about 2.1 million km², it is bigger than New Guinea (Australia counts as a continent).');
// Pop culture
S('pop', true,  'Mario\'s original name was "Jumpman".', 'He was the hero of Donkey Kong in 1981 before being renamed after a landlord named Mario Segale.');
S('pop', false, 'Darth Vader says "Luke, I am your father."', 'The real line is "No, I am your father."');
S('pop', true,  'Minecraft is the best-selling video game of all time.', 'It has sold over 300 million copies.');
S('pop', false, 'Sherlock Holmes says "Elementary, my dear Watson" in the original stories.', 'The exact phrase never appears in Conan Doyle\'s writing. It came from later adaptations.');
S('pop', true,  'Tetris was created in the Soviet Union.', 'Alexey Pajitnov made it in Moscow in 1984.');
S('pop', true,  'Pac-Man was reportedly inspired by a pizza with a slice missing.', 'Creator Toru Iwatani has said so.');
S('pop', false, 'Pikachu is number 1 in the Pokédex.', 'Bulbasaur is #1. Pikachu is #25.');
S('pop', true,  'Marvel\'s Black Panther first appeared in comics in 1966.', 'He debuted in Fantastic Four #52, long before the movies.');
S('pop', false, 'The first iPhone was released in 2010.', 'It launched in June 2007.');
// Nigeria & Africa
S('afr', false, 'Lagos is the capital of Nigeria.', 'The capital is Abuja, which replaced Lagos in 1991.');
S('afr', true,  'Nigeria is the most populous country in Africa.', 'It has well over 200 million people.');
S('afr', false, 'Mount Kilimanjaro is in Kenya.', 'Africa\'s tallest mountain is in Tanzania, though you can see it from Kenya.');
S('afr', true,  'Wole Soyinka was the first African to win the Nobel Prize in Literature.', 'The Nigerian writer won it in 1986.');
S('afr', true,  'Lake Victoria is the largest lake in Africa.', 'It is shared by Uganda, Kenya and Tanzania.');
S('afr', false, 'Egypt has more pyramids than any other country.', 'Sudan has more. Its Nubian pyramids number over 200.');
S('afr', false, 'Chimamanda Ngozi Adichie wrote "Things Fall Apart".', 'That novel was written by Chinua Achebe and published in 1958.');
S('afr', true,  'Ghana was the first sub-Saharan African country to gain independence from colonial rule.', 'Ghana became independent from Britain in 1957.');
S('afr', true,  'Fela Kuti pioneered the Afrobeat music genre.', 'The Nigerian legend blended highlife, jazz and funk in the late 1960s and 70s.');
S('afr', true,  'Madagascar is the largest island in Africa.', 'It is also the fourth-largest island in the world.');
S('afr', false, 'Timbuktu is a mythical place that does not really exist.', 'It is a real city in Mali, and it was a famous centre of learning.');
const BYID = Object.fromEntries(BANK.map(s => [s.id, s]));

/* ─── Helpers ────────────────────────────────────────────────────────────── */
const $ = (sel, root = document) => root.querySelector(sel);
const app = $('#app');
/** Escape EVERYTHING user-supplied before it touches innerHTML. */
const esc = s => String(s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const uid = () => (crypto.randomUUID ? crypto.randomUUID() : Math.random().toString(36).slice(2) + Date.now().toString(36));
const cleanName = s => String(s || '').replace(/[\u0000-\u001f\u007f<>]/g, '').replace(/\s+/g, ' ').trim().slice(0, NAME_MAX);
const shuffle = a => { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };
const randCode = () => { const L = 'ABCDEFGHJKLMNPQRSTUVWXYZ'; return Array.from({ length: 4 }, () => L[Math.floor(Math.random() * L.length)]).join(''); };
const store = {
  get: k => { try { return localStorage.getItem(k); } catch { return null; } },
  set: (k, v) => { try { localStorage.setItem(k, v); } catch {} },
  del: k => { try { localStorage.removeItem(k); } catch {} },

let toastTimer;
function toast(msg, ms = 2800) {

  clearTimeout(toastTimer); toastTimer = setTimeout(() => t.classList.remove('show'), ms);

/* ─── Sound (Web Audio, no files) ────────────────────────────────────────── */
const Sound = (() => {
  let ctx, muted = store.get('fof_mute') === '1';
  const ac = () => {
    if (!ctx) { try { ctx = new (window.AudioContext || window.webkitAudioContext)(); } catch { return null; } }
    if (ctx.state === 'suspended') ctx.resume();
    return ctx;
  };
  function tone(freq, dur, o = {}) {
    if (muted) return; const c = ac(); if (!c) return;
    const t = c.currentTime + (o.when || 0), osc = c.createOscillator(), g = c.createGain();
    osc.type = o.type || 'square'; osc.frequency.setValueAtTime(freq, t);
    if (o.to) osc.frequency.exponentialRampToValueAtTime(o.to, t + dur);
    g.gain.setValueAtTime(o.vol || .12, t); g.gain.exponentialRampToValueAtTime(.0001, t + dur);
    osc.connect(g); g.connect(c.destination); osc.start(t); osc.stop(t + dur + .03);
  }
  const seq = (notes, step = .1, o = {}) => notes.forEach((f, i) => tone(f, step * 1.4, { ...o, when: i * step }));
  return {
    unlock: ac,
    click:   () => tone(520, .06, { to: 880 }),
    join:    () => seq([523, 659, 784], .07),
    start:   () => seq([392, 523, 659, 784, 1047], .08),
    tick:    () => tone(900, .05, { type: 'square', vol: .1 }),
    correct: () => seq([659, 880, 1175], .08, { type: 'triangle', vol: .2 }),
    wrong:   () => { tone(220, .3, { type: 'sawtooth', to: 70, vol: .18 }); tone(160, .35, { type: 'square', to: 50, vol: .1, when: .08 }); },
    win:     () => seq([523, 659, 784, 1047, 784, 1047, 1319], .11, { type: 'square', vol: .13 }),
    isMuted: () => muted,
    toggle() { muted = !muted; store.set('fof_mute', muted ? '1' : '0'); return muted; },
  };
})();
const muteBtn = $('#mute');
const paintMute = () => { muteBtn.textContent = Sound.isMuted() ? '🔇' : '🔊'; };
muteBtn.onclick = () => { Sound.toggle(); paintMute(); Sound.click(); };
paintMute();

/* ─── State ──────────────────────────────────────────────────────────────── */
const sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY, { realtime: { params: { eventsPerSecond: 10 } } });
let G = null; // game session (null while on the home screen)
const newSession = (code, me) => ({
  code, me, room: null, players: [], votes: [], beats: {}, viewKey: '', seen: new Set(),
  chan: null, hb: null, poll: null, loop: null, refreshing: false, again: false, ending: false,
  myVote: null, qStart: 0, timerSec: 15, lastOn: -1, lastSecs: -1, lastHostCheck: 0,
});
const isHost = () => G && G.room && G.room.host_id === G.me.id;
const isActive = p => p.id === G.me.id || (G.beats[p.id] && Date.now() - G.beats[p.id].t < AWAY_AFTER_MS);
const activePlayers = () => G.players.filter(isActive);

/* ─── Scoring (derived from votes; identical on every device) ────────────── */
/** 100 for a correct answer + up to 100 speed bonus + streak bonus (20 per consecutive correct after the first, max 100). */
function scoreRound(correct, ms, timerMs, streak) {
  if (!correct) return { base: 0, speed: 0, bonus: 0, total: 0 };
  const speed = Math.round(100 * Math.max(0, 1 - ms / timerMs));
  const bonus = streak >= 2 ? Math.min(100, 20 * (streak - 1)) : 0;
  return { base: 100, speed, bonus, total: 100 + speed + bonus };
}
/** → Map(playerId → { score, streak, rounds: [{answered, correct, choice, base, speed, bonus, total}] }) for rounds 0..upTo */
function computeAll(upTo) {
  const { room, votes, players } = G, timerMs = room.settings.timer * 1000, out = new Map();
  const byKey = new Map(votes.map(v => [v.round + ':' + v.player_id, v]));
  for (const p of players) {
    let score = 0, streak = 0; const rounds = [];
    for (let r = 0; r <= upTo; r++) {
      const v = byKey.get(r + ':' + p.id), st = BYID[room.deck[r]];
      const correct = !!(v && st && v.choice === st.a);
      streak = correct ? streak + 1 : 0;
      const sc = scoreRound(correct, v ? v.ms : 0, timerMs, streak);
      score += sc.total; rounds.push({ answered: !!v, correct, choice: v ? v.choice : null, ...sc });
    }
    out.set(p.id, { score, streak, rounds });
  }
  return out;
}

/* ─── Backend: session lifecycle ─────────────────────────────────────────── */
function backendError(error) {
  const m = (error && (error.message || error.code)) || '';
  if (/room_full/.test(m)) return 'That room is full (8 players max).';
  if (/room_started/.test(m)) return 'That game has already started.';
  if (/room_missing/.test(m)) return 'Room not found.';
  if (error && (error.code === '42P01' || error.code === 'PGRST205' || /fof_/.test(m) && /does not exist|schema cache/.test(m)))
    return 'Game server not set up yet. Run fact_or_fiction.sql in Supabase.';
  return 'Connection problem. Check your internet and try again.';
}

/** Insert the player row, picking a free avatar and de-duplicating the display name. */
async function addPlayer(code, id, name) {
  const { data: existing, error: e0 } = await sb.from('fof_players').select('name,avatar').eq('room_code', code);
  if (e0) return { error: e0 };
  const usedAv = new Set(existing.map(p => p.avatar));
  const free = AVATARS.filter(a => !usedAv.has(a));
  const avatar = (free.length ? free : AVATARS)[Math.floor(Math.random() * (free.length || AVATARS.length))];
  for (let n = 1; n <= 9; n++) {
    const tryName = n === 1 ? name : name.slice(0, NAME_MAX - 2) + ' ' + n;
    const { error } = await sb.from('fof_players').insert({ id, room_code: code, name: tryName, avatar, beat: Date.now() });
    if (!error) return { name: tryName, avatar, renamed: n > 1 };
    if (error.code !== '23505') return { error };       // 23505 = name already taken → try "Name 2", "Name 3"…
  }
  return { error: { message: 'name_taken' } };
}

async function createRoom() {
  const name = cleanName($('#name').value);
  if (!name) return toast('Type your name first!');
  setBusy(true); store.set('fof_name', name);
  const id = uid(); let code = null;
  for (let i = 0; i < 10 && !code; i++) {
    const c = randCode();
    const { error } = await sb.from('fof_rooms').insert({ code: c, host_id: id });
    if (!error) code = c; else if (error.code !== '23505') { setBusy(false); return toast(backendError(error)); }
  }
  if (!code) { setBusy(false); return toast('Could not make a room. Try again.'); }
  const res = await addPlayer(code, id, name);
  if (res.error) { await sb.from('fof_rooms').delete().eq('code', code); setBusy(false); return toast(backendError(res.error)); }
  Sound.join(); enter(code, { id, name: res.name, avatar: res.avatar });
}

async function joinRoom() {
  const name = cleanName($('#name').value), code = $('#code').value.trim().toUpperCase();
  if (!name) return toast('Type your name first!');
  if (!/^[A-Z]{4}$/.test(code)) return toast('Room codes are 4 letters.');
  setBusy(true); store.set('fof_name', name);
  const { data: room, error } = await sb.from('fof_rooms').select('code,status').eq('code', code).maybeSingle();
  if (error) { setBusy(false); return toast(backendError(error)); }
  if (!room || room.status === 'closed') { setBusy(false); return toast('Room not found. Check the code!'); }
  if (room.status !== 'lobby') { setBusy(false); return toast('That game has already started.'); }
  const id = uid(), res = await addPlayer(code, id, name);
  if (res.error) { setBusy(false); return toast(backendError(res.error)); }
  if (res.renamed) toast('Name was taken: you are "' + res.name + '"', 3500);
  Sound.join(); enter(code, { id, name: res.name, avatar: res.avatar });
}

/** Start (or resume) a session: subscribe to realtime, heartbeat, poll as a safety net. */
function enter(code, me) {
  store.set('fof_session', JSON.stringify({ code, id: me.id }));
  G = newSession(code, me);
  const filt = col => ({ schema: 'public', filter: col + '=eq.' + code });
  G.chan = sb.channel('fof-' + code)
    .on('postgres_changes', { event: '*', table: 'fof_rooms', ...filt('code') }, () => refresh())
    .on('postgres_changes', { event: '*', table: 'fof_players', ...filt('room_code') }, payload => {
      // Heartbeats only change `beat`: record them locally instead of re-fetching everything.
      const o = payload.old, n = payload.new;
      if (payload.eventType === 'UPDATE' && o && n && Object.keys(n).every(k => k === 'beat' || n[k] === o[k])) {
        const b = G.beats[n.id]; if (!b || b.v !== n.beat) G.beats[n.id] = { v: n.beat, t: Date.now() };
      } else refresh();
    })
    .on('postgres_changes', { event: '*', table: 'fof_votes', ...filt('room_code') }, () => refresh())
    .subscribe();
  const beat = () => sb.from('fof_players').update({ beat: Date.now() }).eq('id', me.id).then(() => {});
  G.hb = setInterval(beat, 5000);
  G.poll = setInterval(refresh, 4000);
  refresh();
}

function teardown() {
  if (!G) return;
  clearInterval(G.hb); clearInterval(G.poll); clearInterval(G.loop);
  if (G.chan) sb.removeChannel(G.chan);
  G = null;
}
function goHome(msg) {
  teardown(); store.del('fof_session'); renderHome();
  if (msg) toast(msg, 3800);
}

/** Re-read everything, apply housekeeping rules, then render. Calls are coalesced. */
async function refresh() {
  if (!G) return;
  if (G.refreshing) { G.again = true; return; }
  G.refreshing = true;
  const s = G;
  try {
    const [r, p, v] = await Promise.all([
      sb.from('fof_rooms').select('*').eq('code', s.code).maybeSingle(),
      sb.from('fof_players').select('*').eq('room_code', s.code).order('joined_at'),
      sb.from('fof_votes').select('*').eq('room_code', s.code),
    ]);
    if (G !== s) return;
    if (r.error || p.error || v.error) return;                       // transient: keep showing the last good state
    if (!r.data || r.data.status === 'closed') return goHome('The host closed the room.');
    if (!p.data.some(x => x.id === s.me.id)) return goHome('You are no longer in this room.');
    s.room = r.data; s.players = p.data; s.votes = v.data;
    for (const pl of s.players) {                                     // heartbeat tracking, clock-free
      const b = s.beats[pl.id]; if (!b || b.v !== pl.beat) s.beats[pl.id] = { v: pl.beat, t: Date.now() };
    }
    await housekeeping();
    if (G === s) route();
  } finally {
    s.refreshing = false;
    if (s.again && G === s) { s.again = false; refresh(); }
  }
}

/** Host promotion (if the host vanished) and lobby clean-up of ghost players. */
async function housekeeping() {
  const { room, players, me } = G;
  const host = players.find(p => p.id === room.host_id);
  if (!host || (host.id !== me.id && !isActive(host))) {
    const next = players.filter(p => p.id !== room.host_id && isActive(p))[0]; // oldest present player (list is ordered by join time)
    if (next && next.id === me.id) {
      const { data } = await sb.from('fof_rooms').update({ host_id: me.id }).eq('code', G.code).eq('host_id', room.host_id).select();
      if (data && data.length) { G.room.host_id = me.id; toast('You are the host now!'); }
    }
  }
  if (isHost() && room.status === 'lobby') {
    const ghosts = players.filter(p => p.id !== me.id && !isActive(p) && Date.now() - (G.beats[p.id]?.t || 0) > AWAY_AFTER_MS + 10000);
    if (ghosts.length) sb.from('fof_players').delete().in('id', ghosts.map(g => g.id)).then(() => {});
  }
}

/* ─── Routing: state → screen ────────────────────────────────────────────── */
function route() {
  const r = G.room;
  const key = r.status === 'lobby' ? 'lobby' : r.status === 'ended' ? 'end' : `${r.status}:${r.games}:${r.round}:${r.phase}`;
  if (key !== G.viewKey) {
    clearInterval(G.loop); G.loop = null; G.viewKey = key;
    if (key === 'lobby') { G.seen = new Set(); renderLobby(); }
    else if (key === 'end') renderEnd();
    else if (r.phase === 'question') enterQuestion();
    else enterReveal();
  } else liveUpdate();
}
function liveUpdate() {
  const r = G.room;
  if (r.status === 'lobby') updateLobby();
  else if (r.phase === 'question') updateVoteStatus();
  else updateRevealControls();
}

/* Lobby */
function renderLobby() {
  screen(`

    <div class="roomcode" aria-label="Room code ${esc(G.code.split('').join(' '))}">${G.code.split('').map(c => `<b>${esc(c)}</b>`).join('')}</div>
    <div class="row"><button class="btn ghost" data-act="share">🔗 SHARE LINK</button><button class="btn ghost" data-act="copy">📋 COPY CODE</button></div>

}

    <div class="set-title">SECONDS PER ROUND</div>

async function patchSettings(patch) {
  if (!isHost()) return;
  const next = { ...G.room.settings, ...patch };
  if (!next.cats.length) return toast('Pick at least one category.');
  G.room.settings = next; renderSettings();
  const { error } = await sb.from('fof_rooms').update({ settings: next }).eq('code', G.code);
  if (error) toast(backendError(error));
}
async function startGame() {
  if (!isHost()) return;
  if (activePlayers().length < MIN_PLAYERS) return toast('Need at least 2 players!');
  const st = G.room.settings;
  const deck = shuffle(BANK.filter(s => st.cats.includes(s.cat))).slice(0, st.rounds).map(s => s.id); // shuffled: no repeats within a game
  if (!deck.length) return toast('Pick at least one category.');
  document.querySelectorAll('.btn').forEach(b => b.disabled = true);
  await sb.from('fof_votes').delete().eq('room_code', G.code);
  const { error } = await sb.from('fof_rooms').update({ status: 'playing', round: 0, phase: 'question', deck, games: G.room.games + 1 })
    .eq('code', G.code).eq('status', 'lobby');
  if (error) { toast(backendError(error)); updateLobby(); } else refresh();
}

/* Question */
function enterQuestion() {
  const r = G.room, st = BYID[r.deck[r.round]];
  if (!st) return;
  G.timerSec = r.settings.timer; G.lastOn = -1; G.lastSecs = -1; G.lastHostCheck = 0;
  // Each device times itself. The start time is remembered so a refresh can't reset a player's clock.
  const k = `fof_t_${G.code}_${r.games}_${r.round}`;
  let start = parseInt(store.get(k) || '0', 10);
  if (!start || start > Date.now()) { start = Date.now(); store.set(k, String(start)); }
  G.qStart = start;
  const mine = G.votes.find(v => v.round === r.round && v.player_id === G.me.id);
  G.myVote = mine ? { choice: mine.choice, saved: true } : null;
  const segs = Array.from({ length: 20 }, () => '<i></i>').join('');
  screen(`
    <div class="hud"><span>ROUND ${r.round + 1}/${r.deck.length}</span><span>${CATS[st.cat].icon} ${esc(CATS[st.cat].label.toUpperCase())}</span></div>
    <div class="bar" id="bar" role="timer">${segs}</div>
    <div class="secs" id="secs">${G.timerSec}</div>
    <div class="card stmt pad"><div>${esc(st.q)}</div></div>
    <div style="display:flex;flex-direction:column;gap:14px">
      <button class="btn green big" data-act="vote" data-v="1" id="vf">✅ FACT</button>
      <button class="btn red big" data-act="vote" data-v="0" id="vx">❌ FICTION</button>
    </div>
    <div class="vstat" id="vstat"></div>`);
  paintVote(); updateVoteStatus();
  G.loop = setInterval(questionTick, 100); questionTick();
}
function paintVote() {
  const f = $('#vf'), x = $('#vx'); if (!f) return;
  const over = Date.now() - G.qStart >= G.timerSec * 1000, v = G.myVote;
  for (const b of [f, x]) { b.classList.remove('chosen', 'dim'); b.disabled = !!v || over; }
  if (v) { const pick = v.choice ? f : x, other = v.choice ? x : f; pick.classList.add('chosen'); pick.disabled = false; pick.style.pointerEvents = 'none'; other.classList.add('dim'); }
}
function questionTick() {
  const r = G && G.room; if (!r || r.phase !== 'question') return;
  const total = G.timerSec * 1000, rem = total - (Date.now() - G.qStart), secs = Math.max(0, Math.ceil(rem / 1000));
  const on = Math.ceil(Math.max(0, rem) / total * 20);
  if (on !== G.lastOn) { G.lastOn = on; document.querySelectorAll('#bar i').forEach((el, i) => el.classList.toggle('off', i >= on)); }
  if (secs !== G.lastSecs) {
    G.lastSecs = secs;
    const s = $('#secs'), bar = $('#bar'); if (!s) return;
    s.textContent = secs; const danger = secs <= 5 && secs > 0;
    s.classList.toggle('danger', danger); bar.classList.toggle('danger', danger);
    if (danger && !G.myVote) Sound.tick();
    if (rem <= 0) { paintVote(); updateVoteStatus(); }
  }
  if (isHost() && Date.now() - G.lastHostCheck > 400) { G.lastHostCheck = Date.now(); hostCheck(); }
}
async function castVote(choice) {
  if (!G || G.myVote || G.room.phase !== 'question') return;
  const ms = Date.now() - G.qStart;
  if (ms >= G.timerSec * 1000) return;
  G.myVote = { choice, saved: false }; Sound.click(); paintVote(); updateVoteStatus();
  const round = G.room.round;
  const { error } = await sb.from('fof_votes').insert({ room_code: G.code, round, player_id: G.me.id, choice, ms });
  if (!G || G.room.round !== round) return;
  if (error && error.code !== '23505') { G.myVote = null; paintVote(); updateVoteStatus(); return toast(backendError(error)); }
  G.myVote.saved = true; updateVoteStatus();
}
function votedIds() {
  const r = G.room, ids = new Set(G.votes.filter(v => v.round === r.round).map(v => v.player_id));
  if (G.myVote && G.myVote.saved) ids.add(G.me.id);
  return ids;
}
function updateVoteStatus() {
  const el = $('#vstat'); if (!el || G.room.phase !== 'question') return;
  const act = activePlayers(), ids = votedIds(), n = act.filter(p => ids.has(p.id)).length;
  const over = Date.now() - G.qStart >= G.timerSec * 1000;
  el.innerHTML = G.myVote ? `🔒 LOCKED IN · ${n}/${act.length} VOTED` : over ? `⏰ TIME'S UP · ${n}/${act.length} VOTED` : `${n}/${act.length} VOTED`;
}
/** Host only: end the round when every PRESENT player has voted, or the host's own timer (+grace) runs out. */
async function hostCheck() {
  if (G.ending || G.room.phase !== 'question') return;
  const ids = votedIds(), allVoted = activePlayers().every(p => ids.has(p.id));
  const late = Date.now() - G.qStart >= G.timerSec * 1000 + HOST_GRACE_MS;
  if (!allVoted && !late) return;
  G.ending = true;
  const r = G.room.round;
  try { await sb.from('fof_rooms').update({ phase: 'reveal' }).eq('code', G.code).eq('round', r).eq('phase', 'question'); }
  finally { if (G) G.ending = false; }
}

/* Reveal */
function enterReveal() {
  const r = G.room, st = BYID[r.deck[r.round]]; if (!st) return;
  const all = computeAll(r.round), mine = all.get(G.me.id).rounds[r.round];
  const last = r.round >= r.deck.length - 1;
  const order = G.players.slice().sort((a, b) =>
    all.get(b.id).rounds[r.round].total - all.get(a.id).rounds[r.round].total || all.get(b.id).score - all.get(a.id).score);
  const chip = rd => !rd.answered ? '<span class="ch n">NO ANSWER</span>' : rd.choice ? '<span class="ch f">FACT</span>' : '<span class="ch x">FICTION</span>';
  let result;
  if (mine.correct) {
    const parts = [`100`, `+${mine.speed} speed`, mine.bonus ? `+${mine.bonus} streak` : ''].filter(Boolean).join(' · ');
    result = `<div class="result good">✔ CORRECT! +${mine.total}<small>${parts}</small></div>`;
  } else result = `<div class="result bad">${mine.answered ? '✘ WRONG' : '⏰ NO ANSWER'}<small>0 points · streak reset</small></div>`;
  screen(`
    <div class="hud"><span>ROUND ${r.round + 1}/${r.deck.length}</span><span>${CATS[st.cat].icon} ${esc(CATS[st.cat].label.toUpperCase())}</span></div>
    <div class="verdict ${st.a ? 'fact' : 'fiction'}">${st.a ? '✅ FACT!' : '❌ FICTION!'}</div>
    <div class="card" style="text-align:center">${esc(st.q)}</div>
    <div class="why"><b class="px" style="font-size:10px;color:var(--yellow)">WHY </b>${esc(st.why)}</div>
    ${result}
    <div class="picks">${order.map((p, i) => {
      const rd = all.get(p.id).rounds[r.round];
      return `<div class="pick" style="animation-delay:${.9 + i * .08}s"><span class="av" style="font-size:26px">${esc(p.avatar)}</span>
        <span class="nm">${esc(p.name)}${p.id === G.me.id ? ' <span class="muted">(you)</span>' : ''}</span>${chip(rd)}
        <span class="pts ${rd.total ? 'p' : 'z'}">${rd.total ? '+' + rd.total : '0'}</span></div>`;
    }).join('')}</div>
    <div id="revctl"></div>`);
  updateRevealControls();
  if (mine.correct) { Sound.correct(); burst(['🎉', '✨', '⭐', '🟢', '💥'], 38); } else { Sound.wrong(); shakeScreen(); }
  G.last = last;
}
function updateRevealControls() {
  const el = $('#revctl'); if (!el) return;
  const last = G.room.round >= G.room.deck.length - 1;
  el.innerHTML = isHost()
    ? `<button class="btn yellow" data-act="next">${last ? '🏆 FINAL RESULTS' : 'NEXT ROUND ▶'}</button>`
    : `<p class="px center muted" style="font-size:11px;line-height:1.8">WAITING FOR HOST<span class="dots"></span></p>`;
}
async function nextRound() {
  if (!isHost()) return;
  const r = G.room, last = r.round >= r.deck.length - 1;
  document.querySelectorAll('#revctl .btn').forEach(b => b.disabled = true);
  const patch = last ? { status: 'ended' } : { round: r.round + 1, phase: 'question' };
  const { error } = await sb.from('fof_rooms').update(patch).eq('code', G.code).eq('round', r.round).eq('phase', 'reveal');
  if (error) { toast(backendError(error)); updateRevealControls(); } else refresh();
}

/* End: podium + leaderboard */
function renderEnd() {
  const all = computeAll(G.room.deck.length - 1);
  const board = G.players.map(p => ({ p, ...all.get(p.id) })).sort((a, b) => b.score - a.score || a.p.name.localeCompare(b.p.name));
  const top = board.slice(0, 3), cls = ['p1', 'p2', 'p3'];
  const visual = top.length === 3 ? [1, 0, 2] : top.length === 2 ? [1, 0] : [0];      // 2nd · 1st · 3rd
  const winnerScore = board[0].score;
  screen(`
    <h1 class="logo" style="font-size:22px">GAME OVER!</h1>
    <div class="podium">${visual.map(i => { const e = top[i]; return `
      <div class="pod ${cls[i]}">
        ${i === 0 ? '<span class="crown">👑</span>' : ''}
        <div class="who"><span class="av">${esc(e.p.avatar)}</span>${esc(e.p.name)}</div>
        <div class="block"><span>${i + 1}</span><small>${e.score}</small></div>
      </div>`; }).join('')}</div>
    <div class="card"><h3 class="px" style="font-size:12px;margin-bottom:12px">LEADERBOARD</h3>
      <div class="lb">${board.map((e, i) => `<div class="lbrow ${e.p.id === G.me.id ? 'me' : ''}">
        <span class="rk">${e.score === winnerScore ? '👑' : '#' + (i + 1)}</span><span class="av" style="font-size:24px">${esc(e.p.avatar)}</span>
        <span class="nm">${esc(e.p.name)}</span><span class="sc">${e.score}</span></div>`).join('')}</div></div>
    <div id="endctl"></div>
    <button class="btn ghost" data-act="${isHost() ? 'close' : 'leave'}" id="leavebtn">${isHost() ? '✖ CLOSE ROOM' : '← LEAVE ROOM'}</button>`);
  updateEndControls();
  Sound.win(); burst(['🎉', '🏆', '⭐', '🎊', '👑'], 60);
}
function updateEndControls() {
  const el = $('#endctl'); if (!el) return;
  el.innerHTML = isHost() ? `<button class="btn green" data-act="again">🔁 PLAY AGAIN</button>`
    : `<p class="px center muted" style="font-size:11px;line-height:1.8">WAITING FOR HOST<span class="dots"></span></p>`;
}
async function playAgain() {
  if (!isHost()) return;
  document.querySelectorAll('.btn').forEach(b => b.disabled = true);
  // Drop anyone who left, wipe the votes (= scores), and send the room back to the lobby.
  const gone = G.players.filter(p => !isActive(p)).map(p => p.id);
  if (gone.length) await sb.from('fof_players').delete().in('id', gone);
  await sb.from('fof_votes').delete().eq('room_code', G.code);
  const { error } = await sb.from('fof_rooms').update({ status: 'lobby', round: 0, phase: 'question', deck: [] }).eq('code', G.code);
  if (error) toast(backendError(error)); else refresh();
}

/* ─── Leave / close / kick / share ───────────────────────────────────────── */
async function leaveRoom() {
  const id = G.me.id; sb.from('fof_players').delete().eq('id', id).then(() => {});
  goHome();
}
async function closeRoom() {
  if (!confirm('Close the room for everyone?')) return;
  await sb.from('fof_rooms').update({ status: 'closed' }).eq('code', G.code);
  goHome('Room closed.');
}
async function kick(id) { if (!isHost() || id === G.me.id) return; await sb.from('fof_players').delete().eq('id', id); refresh(); }
function shareUrl() { return location.origin + location.pathname + '?room=' + G.code; }
async function share() {
  const url = shareUrl(), text = `Join my Fact or Fiction game! Code: ${G.code}`;
  if (navigator.share) { try { await navigator.share({ title: 'Fact or Fiction', text, url }); return; } catch (e) { if (e.name === 'AbortError') return; } }
  copy(url, 'Link copied!');
}
function copy(text, msg) {
  const done = () => toast(msg || 'Copied!');
  if (navigator.clipboard) navigator.clipboard.writeText(text).then(done, () => toast('Code: ' + G.code));
  else toast('Code: ' + G.code);
}

/* ─── Input: one delegated click handler ─────────────────────────────────── */
document.addEventListener('click', e => {
  const el = e.target.closest('[data-act]'); if (!el || el.disabled) return;
  Sound.unlock();
  const a = el.dataset.act;
  switch (a) {
    case 'create': createRoom(); break;
    case 'join': joinRoom(); break;
    case 'start': startGame(); break;
    case 'next': nextRound(); break;
    case 'again': playAgain(); break;
    case 'leave': leaveRoom(); break;
    case 'close': closeRoom(); break;
    case 'kick': Sound.click(); kick(el.dataset.id); break;
    case 'share': Sound.click(); share(); break;
    case 'copy': Sound.click(); copy(G.code, 'Code copied!'); break;
    case 'vote': castVote(el.dataset.v === '1'); break;
    case 'cat': { Sound.click(); const cats = G.room.settings.cats, k = el.dataset.k; patchSettings({ cats: cats.includes(k) ? cats.filter(c => c !== k) : [...cats, k] }); break; }
    case 'rounds': Sound.click(); patchSettings({ rounds: +el.dataset.n }); break;
    case 'timer': Sound.click(); patchSettings({ timer: +el.dataset.n }); break;
  }
});
// Coming back to the tab (phones sleep): beat immediately and re-sync.
document.addEventListener('visibilitychange', () => {
  if (document.visibilityState === 'visible' && G) { sb.from('fof_players').update({ beat: Date.now() }).eq('id', G.me.id).then(() => {}); refresh(); }
});

/* ─── Boot: restore a seat after refresh, else show the home screen ──────── */
(async function boot() {
  renderHome();
  let saved = null; try { saved = JSON.parse(store.get('fof_session') || 'null'); } catch {}
  if (!saved || !saved.code || !saved.id) return;
  const [r, p] = await Promise.all([
    sb.from('fof_rooms').select('status').eq('code', saved.code).maybeSingle(),
    sb.from('fof_players').select('*').eq('id', saved.id).eq('room_code', saved.code).maybeSingle(),
  ]);
  if (r.error || p.error) return;                                   // offline: stay on home, session kept for next load
  if (!r.data || r.data.status === 'closed' || !p.data) { store.del('fof_session'); return; }
  toast('Welcome back, ' + p.data.name + '!');
  enter(saved.code, { id: p.data.id, name: p.data.name, avatar: p.data.avatar });
})();
</script>
</body>
</html>
